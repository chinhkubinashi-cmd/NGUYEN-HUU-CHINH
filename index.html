
<!DOCTYPE html>

    <script>
      // Fix for Chrome extensions attempting to monkey-patch window.fetch when it only has a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var _fetch = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            }
          });
        } catch (e) {
          // Ignore if cannot redefine
        }

        // Prevent browser extension errors from breaking the page or showing unhandled error screens
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch of #<Window>') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          if (reason) {
            var msg = reason.message || (typeof reason === 'string' ? reason : '');
            var stack = reason.stack || '';
            if (
              msg.indexOf('chrome-extension://') !== -1 ||
              stack.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }
        });
      })();
    </script>
